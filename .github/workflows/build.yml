name: Build
on:
  push:
    branches: ["*"]
jobs:
  build-windows:
    env:
      BUILD_TYPE: Release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      # Need to configure before Python otherwise it will override the PATH set by the virtualenv
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create requirements.txt
        run: echo "numpy==1.26.0" > requirements.txt
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: '3.10'
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Configure
        run: |
          cmake --preset windows-static \
            -DBUILD_DEMO=off \
            -DENABLE_LINTING=off \
            -DENABLE_TEST_SANITIZERS=off \
            -DRECAP_LABELLER_LOG_TO_APP_DATA_DIR=on
        env:
            VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run tests
        env:
          GTEST_COLOR: "yes"
          ASAN_OPTIONS: "color=always"
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Rename executable for artifact upload
        run: |
          version=$(cd build && cmake -N --system-information | grep "^CMAKE_PROJECT_VERSION:STATIC=")
          version=$(echo "$version" | cut -d= -f2)
          sha=$(git rev-parse --short HEAD)
          artifact_basename=recap-labeller-${version}-complete-data-${sha}-win64
          mv build/${{ env.BUILD_TYPE }}/recap-labeller.exe "${artifact_basename}.exe"
          echo "ARTIFACT_BASENAME=${artifact_basename}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ env.ARTIFACT_BASENAME }}
          path: ${{ env.ARTIFACT_BASENAME }}.exe
