name: Build
on:
  push:
    branches: [main]
jobs:
  build-windows:
    env:
      BUILD_TYPE: Release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      # Need to configure before Python otherwise it will override the PATH set by the virtualenv
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create requirements.txt
        run: echo "numpy==1.26.0" > requirements.txt
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: '3.10'
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Configure
        run: |
          cmake --preset windows-static-ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_DEMO=off \
            -DRECAP_LABELLER_LOG_TO_APP_DATA_DIR=on \
            -DENABLE_LINTING=off
        env:
            VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        env:
          GTEST_COLOR: "yes"
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recap-labeller
          path: build/recap-labeller*.exe
          if-no-files-found: error
