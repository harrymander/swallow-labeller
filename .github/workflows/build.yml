name: Build
on:
  push:
    branches: ["*"]
env:
  UV_VERSION: "0.11.14"
jobs:
  build-windows:
    env:
      BUILD_TYPE: Release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run pre-commit hooks
        run: uvx "pre-commit==4.6.0" run --all-files --show-diff-on-failure --color=always

      # Need to configure before Python otherwise it will override the PATH set by the virtualenv
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: uv sync --group test

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Configure
        run: |
          cmake --preset windows-static \
            -DBUILD_DEMO=off \
            -DENABLE_LINTING=off \
            -DRECAP_LABELLER_LOG_TO_APP_DATA_DIR=on
        env:
            VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run tests
        env:
          GTEST_COLOR: "yes"
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recap-labeller
          path: build/${{ env.BUILD_TYPE }}/recap-labeller*.exe
