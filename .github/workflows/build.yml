name: Build
on:
  push:
    branches: [main]
jobs:
  build-windows:
    env:
      BUILD_TYPE: Release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      # Need to configure before Python otherwise it will override the PATH set by the virtualenv
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create requirements.txt
        run: echo "numpy==1.26.0" > requirements.txt
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: '3.10'
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap vcpkg
        run: vcpkg/bootstrap-vcpkg.bat
      - name: Set Git username
        # These values are only needed for applying git patches in cmake - the values are not
        # actually used
        run: |
          git config user.name "GitHub actions"
          git config user.email ""
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run tests
        env:
          GTEST_COLOR: "yes"
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: implot-rects
          path: build/${{ env.BUILD_TYPE }}/implot-rects*.exe
